<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextLevel | Automação Empresarial com IA</title>
    <meta
      name="description"
      content="A NextLevel automatiza o atendimento da sua empresa com inteligência artificial no WhatsApp e no Instagram. Soluções personalizadas para hotéis, pousadas, restaurantes e bares."
    />
    <meta name="theme-color" content="#080A0F" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon: substitua os arquivos em /public para trocar o ícone -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      URL canônica: descomente e ajuste quando houver domínio definitivo.
      <link rel="canonical" href="https://www.seudominio.com.br/" />
    -->

    <!-- Open Graph / compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="NextLevel" />
    <meta property="og:title" content="NextLevel | Automação Empresarial com IA" />
    <meta
      property="og:description"
      content="Automação de atendimento com inteligência artificial para WhatsApp e Instagram, adaptada à rotina do seu negócio."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NextLevel — Seu atendimento no próximo nível" />
    <!-- Quando houver domínio: <meta property="og:url" content="https://www.seudominio.com.br/" /> -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

      <p style="padding:24px;font-family:sans-serif;color:#F5F7FA;background:#080A0F">

        Ative o JavaScript para ver a página completa.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
